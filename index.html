<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Level Up RPG</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
            media="print"
            onload="this.media = 'all'"
        />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #1a1a1a;
            }
            .boot {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                background: #1a1a1a;
                color: #facc15;
                font-family: 'VT323', monospace;
            }
            .boot-title {
                margin: 0;
                font-size: clamp(48px, 10vw, 128px);
                font-weight: 400;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                text-shadow: 6px 6px 0 #000;
            }
            .boot-bar {
                width: min(480px, 70vw);
                height: 20px;
                overflow: hidden;
                background: #0c0a09;
                border: 3px solid #57534e;
                border-radius: 4px;
            }
            .boot-fill {
                width: 100%;
                height: 100%;
                background: linear-gradient(to right, #16a34a, #4ade80);
                transform: scaleX(0);
                transform-origin: left;
                transition: transform 0.2s ease-out;
            }
            .boot-percent {
                margin: 0;
                font-size: 32px;
                color: #e7e5e4;
            }
            .boot-error {
                text-align: center;
                font-size: 24px;
                color: #fca5a5;
            }
            .boot-error button {
                margin-top: 8px;
                padding: 4px 16px;
                font: inherit;
                color: #fff;
                background: #44403c;
                border: 2px solid #78716c;
                border-radius: 4px;
                cursor: pointer;
            }
            .boot-leaving {
                pointer-events: none;
                animation: boot-out 0.3s ease-out forwards;
            }
            @keyframes boot-out {
                to {
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <div id="root">
            <div
                class="boot"
                role="progressbar"
                aria-label="Loading"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            >
                <h1 class="boot-title">Level Up!</h1>
                <div class="boot-bar"><div class="boot-fill"></div></div>
                <p class="boot-percent">0%</p>
            </div>
        </div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
